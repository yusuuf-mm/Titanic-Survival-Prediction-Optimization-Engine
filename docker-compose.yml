services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - S3_BUCKET_NAME=titanic-prediction-bucket
      - DYNAMODB_TABLE_NAME=predictions
      - RATE_LIMIT_TABLE=rate-limits
      - AWS_REGION=us-east-1
      - ENABLE_RATE_LIMIT=false
      - UPLOAD_TO_S3=false
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
